name: Release

# Publishing is tag-driven so `latest` never moves by accident on a push to
# main. Pushing a vX.Y.Z tag publishes that immutable tag AND repoints
# `latest` at it.
#
# `latest` alone is not a deployable reference: a Deployment pinned to it
# cannot be rolled back, and with imagePullPolicy: IfNotPresent a node that
# already has the layer will not re-pull. Every release therefore also gets
# an immutable vX.Y.Z tag and a digest, which is what a manifest should pin.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v1.0.0)"
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: verify before publishing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: go.sum
      - run: go vet ./...
      # An artifact is not published from a red tree.
      - run: go test ./...

  publish:
    name: build and push image
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The Dockerfile runs `git describe` for the version stamp, which
          # needs tags and history rather than a depth-1 checkout.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        run: |
          version="${{ github.event.inputs.tag }}"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          lower=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/$lower" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only: the hypervisor fleet is x86 (KVM and Proxmox), so an
          # arm64 image has no consumer. Building it meant emulating arm64 under
          # QEMU, which dominated the release time (~30 min against ~2). Add the
          # platform back here, with setup-qemu-action above it, if ARM nodes
          # ever land.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          provenance: false

      - name: Summary
        run: |
          {
            echo "### Published"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
            echo "${{ steps.meta.outputs.image }}:latest"
            echo ""
            echo "digest: ${{ steps.push.outputs.digest }}"
            echo '```'
            echo ""
            echo "Pin the digest in production manifests, not \`latest\`."
          } >> "$GITHUB_STEP_SUMMARY"
